name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Instalar Buildozer e Cython
        run: |
          pip3 install --upgrade pip
          pip3 install --upgrade buildozer cython==0.29.36 virtualenv

      - name: Compilar APK
        run: |
          buildozer -v android debug

      - name: Enviar APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: PongQuadra-APK
          path: bin/*.apk
          
